name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: handoff
          POSTGRES_PASSWORD: handoff
          POSTGRES_DB: handoff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U handoff"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://handoff:handoff@localhost:5432/handoff_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Apply schema
        run: python -m scripts.migrate "$TEST_DATABASE_URL"

      - name: Run tests
        run: python -m pytest -v
