services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: handoff
      POSTGRES_PASSWORD: handoff
      POSTGRES_DB: handoff_dev
    ports:
      - "5432:5432"
    volumes:
      - handoff_pg_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handoff"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  handoff_pg_data:
